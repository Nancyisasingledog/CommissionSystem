<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>委託進度查詢系統</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        /* === 1. 核心變數設定 === */
        :root {
            --main-blue: #62869D;
            --light-blue: #77B7DF;
            --hover-blue: #3290C3;
            --glass-bg: rgba(255, 255, 255, 0.3);
            --text-gray: #666;
            --success-green: #4CAF50;
        }

        /* === 2. 基礎底色與佈局 === */
        body {
            background-image: url('background.jpg'); 
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Montserrat', 'Noto Sans TC', sans-serif;
            -webkit-font-smoothing: antialiased;
            letter-spacing: 0.5px;
        }

        /* === 3. 卡片容器樣式 === */
        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 2.5rem;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            width: 85%;
            max-width: 320px;
            text-align: center;
        }

        h2 { color: var(--main-blue); margin-bottom: 1.5rem; font-weight: 700; letter-spacing: 2px; }
        p { color: var(--main-blue); font-weight: 500; margin: 10px 0; line-height: 1.6; }

        /* === 4. 輸入框與按鈕 === */
        input {
            width: 85%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            color: var(--main-blue);
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }
        input:focus { border-color: #7DB9DE; background: rgba(255, 255, 255, 0.4); }

        button {
            margin-top: 1.2rem;
            width: 95%;
            padding: 12px;
            background-color: var(--light-blue);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background-color: var(--hover-blue); transform: translateY(-2px); }
        button:active { transform: scale(0.9); transition: 0.1s; }

        /* === 5. 查詢結果與動畫區塊 === */
        #result {
            display: none; 
            opacity: 0;
            transition: opacity 0.4s ease;
            margin-top: 25px;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        /* Loading 旋轉圖示 */
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid var(--main-blue);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 狀態標籤與等待人數 */
        .status-tag {
            display: inline-block;
            padding: 4px 14px;
            background-color: var(--main-blue);
            color: white;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        .waiting-tag {
            display: inline-flex;
            align-items: center;
            background: rgba(98, 134, 157, 0.1);
            color: var(--main-blue);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 8px;
            border: 1px solid rgba(98, 134, 157, 0.2);
        }

        /* 進度條樣式 */
        .progress-container {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            height: 12px;
            margin: 15px 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .progress-bar {
            position: relative;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #A2C2D6, var(--main-blue));
            transition: width 1s ease-in-out;
            border-radius: 10px;
        }

        /* 進度條流光效果 */
        .progress-bar::after {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer { 100% { left: 100%; } }
    </style>
</head>
<body>

    <div class="container">
        <h2>委 託 進 度 查 詢</h2>
        <p>請輸入您的訂單編號：</p>
        <input type="text" id="questId" placeholder="請輸入6碼編號：26XXXX">
        <button onclick="queryStatus()">立 即 查 詢</button>
        
        <div id="result"></div>
    </div>

    <script>
        /* === 6. 系統核心配置 === */
        const CONFIG = {
            // 替換為你的 Google Apps Script 部署網址
            GAS_URL: "https://script.google.com/macros/s/AKfycbyWZ2_SgLohiRTZSeOgW98GvTFUEEYZMbkUY_c5ZJWVO9zPNBCEcNERMaScL5P3I6K9/exec",
            // 狀態與進度百分比對應表
            PROGRESS_MAP: {
                "排單中": 00,
                "處理中": 25,
                "草稿": 50,
                "精稿": 75,
                "完稿": 100
            },
            ANIMATION_DURATION: 1000 // 數字跳動時間 (毫秒)
        };

        /**
         * 核心查詢函式
         */
        async function queryStatus() {
            const idInput = document.getElementById('questId').value.trim();
            const resultDiv = document.getElementById('result');
            const apiUrl = `${CONFIG.GAS_URL}?id=${idInput}`;

            // 初始化結果區域
            resultDiv.style.display = "flex";
            resultDiv.style.opacity = "0";

            if (!idInput) {
                showFeedback(resultDiv, "⚠️ 請輸入編號再查詢！", false);
                return;
            }

            // 顯示 Loading 狀態
            showFeedback(resultDiv, "正在搜尋資料...", true);

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.status === "success") {
                    renderResult(data, resultDiv);
                } else {
                    showFeedback(resultDiv, "❌ 找不到此編號，請重新確認。", false);
                }
            } catch (error) {
                console.error("Fetch Error:", error);
                showFeedback(resultDiv, "🔌 連線超時，請檢查網路連線。", false);
            }
        }

        /**
         * 渲染成功結果的 HTML
         */
        function renderResult(data, container) {
            const progressPercent = CONFIG.PROGRESS_MAP[data.progress] || 10;
            
            // 判斷是否顯示等待人數或祝賀詞
            const waitingHtml = data.progress !== "完稿" 
                ? `<div class="waiting-tag">⏳ 前方尚有 ${data.waiting ?? 0} 人排隊中</div>`
                : `<div style="margin-top: 10px; font-size: 0.85rem; color: var(--success-green); font-weight: bold;">🎉 委託已完成！</div>`;

            container.innerHTML = `
                <div style="width: 100%; text-align: center;">
                    <p style="margin: 0; color: var(--text-gray); font-size: 0.85rem;">委託項目</p>
                    <div style="font-size: 1.15rem; font-weight: bold; color: var(--main-blue); margin-bottom: 5px;">${data.project || "未命名項目"}</div>
                    
                    <div style="display: flex; flex-direction: column; align-items: center;">
                        <div class="status-tag">${data.progress}</div>
                        ${waitingHtml}
                    </div>

                    <hr style="border: 0; border-top: 1px solid rgba(0,0,0,0.05); margin: 20px auto; width: 60%;">
                    
                    <div style="margin-bottom: 10px;">
                        <span id="progressNumber" style="color: var(--main-blue); font-size: 0.85rem; font-weight: bold;">您的案件完成進度：0%</span>
                        <div class="progress-container">
                            <div id="myBar" class="progress-bar"></div>
                        </div>
                    </div>
                    <p style="font-size: 11px; color: #999;">最後更新：${data.lastUpdate ? new Date(data.lastUpdate).toLocaleDateString() : "近期"}</p>
                </div>
            `;

            // 啟動動畫
            setTimeout(() => {
                container.style.opacity = "1";
                const bar = document.getElementById("myBar");
                const numDisplay = document.getElementById("progressNumber");
                
                // 進度條平滑移動
                if (bar) bar.style.width = progressPercent + "%";
                
                // 數字跳動動畫
                animateNumber(numDisplay, progressPercent);
            }, 50);
        }

        /**
         * 數字跳動動畫邏輯
         */
        function animateNumber(element, target) {
            if (!element) return;
            let startTime = performance.now();
            
            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / CONFIG.ANIMATION_DURATION, 1);
                const currentNum = Math.floor(progress * target);
                
                element.innerText = `完成進度：${currentNum}%`;

                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }
            requestAnimationFrame(update);
        }

        /**
         * 輔助函式：顯示提示訊息或 Loading 圖示
         */
        function showFeedback(element, message, isLoading = false) {
            let content = `<span style="color: var(--main-blue); font-weight: 500; font-size: 0.95rem;">${message}</span>`;
            if (isLoading) {
                content = `<div class="loading-box"><div class="loader"></div>${content}</div>`;
            }
            element.innerHTML = content;
            setTimeout(() => { element.style.opacity = "1"; }, 50);
        }

        /* === 7. 事件監聽：支援 Enter 鍵查詢 === */
        document.getElementById("questId").addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                queryStatus();
            }
        });
    </script>
</body>
</html>
